services:

  # ── Backend — FastAPI ───────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: flow-transcriber-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      # Permite que "host.docker.internal" resuelva al host real en Linux
      - "host.docker.internal:host-gateway"
    volumes:
      - ./out:/app/out
      # Cache de modelos Whisper: persiste entre reinicios
      - whisper_cache:/root/.cache/whisper
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
        required: false  # No falla si el perfil with-ollama no está activo

  # ── Frontend — Next.js ──────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: flow-transcriber-frontend
    ports:
      - "${PORT:-3000}:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # ── Ollama (opcional) ───────────────────────────────────────────────────────
  # Solo se levanta con: docker compose --profile with-ollama up
  # Si Ollama ya corre en el host NO se inicia este contenedor.
  ollama:
    image: ollama/ollama:latest
    container_name: flow-transcriber-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    profiles:
      - with-ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  ollama_data:    # Modelos descargados de Ollama
  whisper_cache:  # Modelos de Whisper
