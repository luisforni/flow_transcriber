# nginx virtual host — Flow Transcriber (subdomain de luisforni.com)
# Ruta: /etc/nginx/sites-available/flow-transcriber
# Activar: sudo ln -s /etc/nginx/sites-available/flow-transcriber /etc/nginx/sites-enabled/
# SSL:     sudo certbot --nginx -d transcriber.luisforni.com

server {
    listen 80;
    server_name transcriber.luisforni.com;

    # Streamlit requiere soporte WebSocket para comunicación en tiempo real
    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers de proxy estándar
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit media streaming needs long timeouts
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        # Tamaño máximo de subida (ajustar según necesidad de archivos de audio)
        client_max_body_size 500M;
    }

    # Archivos estáticos de Streamlit
    location /static {
        proxy_pass http://127.0.0.1:8501/static;
    }
}
